# Garde le serveur OI (Supabase, offre gratuite) éveillé : sans requête pendant ~7 jours, le
# projet est mis en pause et tout s'arrête (boutique, amis, groupes, matchmaking, clé des packs).
# 2026-11-11 : toutes les 6 h (GitHub saute parfois une exécution planifiée : le passage de 06:17
# du 11/11 n'a jamais eu lieu), trois essais (la fonction serveur lit la base), et
# la tâche se réactive elle-même : GitHub coupe les tâches planifiées d'un dépôt public après
# 60 jours sans commit. Un échec envoie un e-mail au propriétaire du dépôt.
name: Réveil du serveur OI
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête au serveur OI (fonction access, lit la base)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST https://fiqokgmnepwnqofxtbqm.supabase.co/functions/v1/access -H 'content-type: application/json' -d '{"action":"catalog"}')
            echo "essai $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "Serveur OI injoignable : projet Supabase peut-être en pause (le réactiver dans le tableau de bord)."
          exit 1
      - name: Garde cette tâche planifiée active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" && echo "tâche réactivée"
