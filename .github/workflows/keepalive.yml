# Garde le serveur OI (Supabase, offre gratuite) éveillé : sans requête pendant ~7 jours, le
# projet est mis en pause et tout s'arrête (boutique, amis, matchmaking, clé des packs).
name: Réveil du serveur OI
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête au serveur OI (lit la base)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://fiqokgmnepwnqofxtbqm.supabase.co/functions/v1/access -H 'content-type: application/json' -d '{"action":"catalog"}')
          echo "HTTP $code"
          test "$code" = "200"
